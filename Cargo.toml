[workspace]
members = [".", "crates/core", "crates/helpers", "app/src-tauri", "xtask"]
default-members = [".", "crates/core", "crates/helpers", "app/src-tauri"]
resolver = "2"

[package]
name = "deepcool-digital-linux"
version = "0.16.1"
edition = "2021"
description = "Controller for the digital displays of DeepCool CPU coolers and cases"
license = "GPL-3.0-only"
repository = "https://github.com/tajbinkhan/deepcool-digital-desktop"

[dependencies]
deepcool-core = { path = "crates/core" }
hidapi = "2.6.7"
colored = "3.1.1"

[profile.release]
opt-level = 3
lto = true
strip = "symbols"
