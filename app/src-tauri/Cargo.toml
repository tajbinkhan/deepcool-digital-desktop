[package]
name = "deepcool-digital-app"
version = "0.16.0"
edition = "2021"
description = "Desktop control panel for DeepCool Digital USB displays"
license = "GPL-3.0-only"
repository = "https://github.com/tajbinkhan/deepcool-digital-desktop"

[lib]
name = "deepcool_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
deepcool-core = { path = "../../crates/core" }
hidapi = "2.6.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
glib = "0.18"
sha2 = "0.11"
ureq = "3.5"

[features]
# Embeds the built frontend (app/dist) instead of loading the dev server. Release packages use it.
custom-protocol = ["tauri/custom-protocol"]
