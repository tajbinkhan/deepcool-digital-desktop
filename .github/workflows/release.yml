# Builds Linux packages when a version tag (for example v0.12.0) is pushed and publishes
# them as a GitHub release right away. Installed copies then offer it as an update, so
# test a build first (run this workflow by hand on main; see RELEASING.md).
#
# Packages are built inside Ubuntu 22.04 so they link against glibc 2.35 and run on
# Ubuntu 22.04+, Debian 12+, Fedora 36+, Arch and other distributions of that age or newer.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libudev-dev curl ca-certificates git \
            dpkg-dev rpm zstd file binutils xz-utils \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Node.js and pnpm
        run: |
          curl -fsSL https://nodejs.org/dist/v22.20.0/node-v22.20.0-linux-x64.tar.xz | tar -xJ -C /opt
          # npm runs through "#!/usr/bin/env node", so node must be on PATH in this step too.
          export PATH="/opt/node-v22.20.0-linux-x64/bin:$PATH"
          echo "/opt/node-v22.20.0-linux-x64/bin" >> "$GITHUB_PATH"
          npm install -g pnpm@10
          node --version && pnpm --version

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' app/src-tauri/Cargo.toml | head -n1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match app/src-tauri/Cargo.toml version $version"; exit 1; }

      - name: Build the app's web frontend
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

      - name: Test
        run: cargo test --workspace --locked

      - name: Build packages
        run: cargo xtask package --formats deb,rpm,arch,tar

      - name: Show glibc requirement
        run: |
          for binary in target/release/deepcool-digital-app target/release/deepcool-digital-linux; do
            echo "$binary: $(objdump -T "$binary" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -n1)"
          done
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/

      - name: Read the version from the tag
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          make_latest: true
          name: DeepCool Digital Desktop ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Install

            Download the file for your distribution below, then:

            | Distribution | Command |
            |---|---|
            | Debian, Ubuntu, Linux Mint, Pop!_OS | `sudo apt install ./deepcool-digital-gui_${{ steps.version.outputs.version }}_amd64.deb` |
            | Fedora, openSUSE | `sudo dnf install ./deepcool-digital-gui-${{ steps.version.outputs.version }}-1.x86_64.rpm` |
            | Arch Linux, Manjaro, EndeavourOS | `sudo pacman -U deepcool-digital-gui-${{ steps.version.outputs.version }}-1-x86_64.pkg.tar.zst` |
            | Other (portable) | Extract `deepcool-digital-gui-${{ steps.version.outputs.version }}-x86_64.tar.gz` and run `DeepCoolDigital/AppRun` (needs WebKitGTK 4.1 and libayatana-appindicator3) |

            Installed copies (0.14.0 and newer) offer this release as an update in the app. Installing over an older version keeps your saved settings.

            **Requirements:** x86_64, a graphical desktop (Wayland or X11), glibc 2.35 or newer. Verify downloads with `sha256sum -c SHA256SUMS`.

            Built on [deepcool-digital-linux](https://github.com/Nortank12/deepcool-digital-linux) by Nortank12 and contributors. Licensed under the GNU GPL v3.0.
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.tar.gz
            dist/SHA256SUMS
