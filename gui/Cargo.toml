[package]
name = "deepcool-digital-gui"
version = "0.15.1"
edition = "2021"
description = "Desktop control panel for DeepCool Digital USB displays"
license = "GPL-3.0-only"
default-run = "deepcool-digital-gui"
repository = "https://github.com/tajbinkhan/deepcool-digital-desktop"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
serde_json = "1.0"
sha2 = "0.11"
ureq = "3.5"
deepcool-core = { path = "../crates/core" }
# GNOME on Wayland has apps draw their own title bar. This draws the standard
# Adwaita one (following the system's light/dark style and button layout) instead
# of winit's plain fallback frame. Other desktops keep their own title bar.
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }
